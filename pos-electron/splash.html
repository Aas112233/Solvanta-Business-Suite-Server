<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solvanta POS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: #f8fafc;
        }

        .card {
            width: 420px;
            padding: 40px 32px;
            border-radius: 24px;
            text-align: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            display: grid;
            place-items: center;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        p {
            color: #cbd5e1;
            font-size: 13px;
        }

        .loader {
            margin: 24px auto 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(148, 163, 184, 0.4);
            border-top-color: #38bdf8;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">S</div>
        <h1>Solvanta POS</h1>
        <p>Launching terminal...</p>
        <div class="loader"></div>
    </div>
</body>
</html>
